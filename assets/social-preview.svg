<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Family Travel Editor: clips, a scene plan, and a controlled revision</title><desc id="desc">Illustrative workflow for an AI agent skill, not an app interface. Source clips become a scene plan. Editing happens in your chosen editor. A request trims two seconds from the last shot, preserves earlier shots and keeps both versions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#315bea" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#171b25}.mono{font-family:Menlo,Consolas,monospace}.label{letter-spacing:1.3px}</style>
