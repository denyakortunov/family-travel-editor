<rect x="40" y="326" width="792" height="184" rx="20" fill="#fff" stroke="#dae3f0"/><circle cx="83" cy="372" r="23" fill="#2361b8"/><text x="83" y="381" text-anchor="middle" font-size="26" fill="white">2</text><text x="125" y="377" font-size="30" font-weight="700">Shape one scene with your agent</text><text x="68" y="428" font-size="23" fill="#53667e">Questions → story → selected shots</text><text x="68" y="465" font-size="23" fill="#53667e">You confirm the facts and direction</text><g transform="translate(626 407)"><rect width="151" height="72" rx="8" fill="#edf2fb"/><path d="M17 20H128M17 36H108M17 52H118" stroke="#95afd3" stroke-width="7" stroke-linecap="round"/><circle cx="133" cy="-5" r="18" fill="#e4ede6"/><path d="m124-5 6 6 11-12" stroke="#507e62" stroke-width="3" fill="none"/></g>
