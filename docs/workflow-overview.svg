<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">From travel clips to a scene you can revise</title><desc id="desc">Start with footage and your context. The agent helps create a scene and shot plan. Build a first cut, review it, and feed corrections back into the plan. You make the creative decisions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3573c7"/></marker></defs><rect width="960" height="820" rx="24" fill="#f4f7fc"/><g font-family="Arial,sans-serif" fill="#15263d"><text x="48" y="62" font-size="34" font-weight="700">Your footage. A story you can finish.</text>
<rect x="40" y="100" width="792" height="184" rx="20" fill="#fff" stroke="#dae3f0"/><circle cx="83" cy="146" r="23" fill="#2361b8"/><text x="83" y="155" text-anchor="middle" font-size="26" fill="white">1</text><text x="125" y="151" font-size="30" font-weight="700">Bring the clips and context</text><text x="68" y="202" font-size="23" fill="#53667e">Camera + drone footage</text><text x="68" y="239" font-size="23" fill="#53667e">Your memories and intent</text>
