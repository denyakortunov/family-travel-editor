<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">From travel footage to a film with a story</title><desc id="desc">Gather the trip, find the story, edit in your chosen editor, review and refine, then approve delivery and save context. Review returns to editing. The skill guides the process; direct editing requires a tested connection.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#52635c" stroke-width="1.5"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a75532" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d26}.serif{font-family:Georgia,Times,serif}.muted{fill:#52635c}.label{font-size:15px;letter-spacing:2.2px}.line{fill:none;stroke:#52635c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1130" rx="20" fill="#f8f5ed"/>
<text x="58" y="65" font-size="15" class="label" >FAMILY TRAVEL EDITOR / THE WORKFLOW</text>
<text x="56" y="140" font-size="62" class="serif" >From moments to a film.</text>
<text x="60" y="184" font-size="24" class="muted" >Your story. Your tools. Your decisions.</text>
<text x="164" y="238" font-size="14" class="label" >THE PROCESS</text>
<text x="668" y="238" font-size="14" class="label" >WHAT YOU KEEP</text>
<path d="M56 260H1082" stroke="#d8dbcf"/>
<text x="60" y="322" font-size="39" class="serif" >01</text>
<text x="164" y="312" font-size="32" class="serif" >Gather the trip</text>
<text x="164" y="346" font-size="21" class="muted" >Footage, context, your memories.</text>
<text x="668" y="318" font-size="22" class="" >A catalogue + useful questions</text>
<path d="M81 340V376" class="line" marker-end="url(#arrow)"/>
<path d="M56 392H1082" stroke="#d8dbcf"/>
<text x="60" y="454" font-size="39" class="serif" >02</text>
<text x="164" y="444" font-size="32" class="serif" >Find the story</text>
<text x="164" y="478" font-size="21" class="muted" >Choose moments. Record your voice.</text>
<text x="668" y="450" font-size="22" class="" >A scene plan + accepted takes</text>
<path d="M81 472V508" class="line" marker-end="url(#arrow)"/>
<path d="M56 524H1082" stroke="#d8dbcf"/>
<text x="60" y="586" font-size="39" class="serif" >03</text>
<text x="164" y="576" font-size="32" class="serif" >Make the edit</text>
<text x="164" y="610" font-size="21" class="muted" >Picture and sound in your editor.</text>
<text x="668" y="582" font-size="22" class="" >A version you can review</text>
<path d="M81 604V640" class="line" marker-end="url(#arrow)"/>
<path d="M56 656H1082" stroke="#d8dbcf"/>
<text x="60" y="718" font-size="39" class="serif" >04</text>
<text x="164" y="708" font-size="32" class="serif" >Watch. Listen. Refine.</text>
<text x="164" y="742" font-size="21" class="muted" >Comments tied to a version and time.</text>
<text x="668" y="714" font-size="22" class="" >Specific changes, earlier cuts kept</text>
<path d="M81 736V772" class="line" marker-end="url(#arrow)"/>
<path d="M56 788H1082" stroke="#d8dbcf"/>
<text x="60" y="850" font-size="39" class="serif" >05</text>
<text x="164" y="837" font-size="31" class="serif" >Keep the film.</text>
<text x="164" y="873" font-size="31" class="serif" >Keep the context.</text>
<text x="668" y="846" font-size="22" class="" >A delivery + a clear next step</text>
<path d="M1098 720H1144V588H1098" fill="none" stroke="#a75532" stroke-width="1.7" marker-end="url(#return)"/>
<text x="1132" y="698" font-size="13" class="label" transform="rotate(-90 1132 698)" style="fill:#a75532">REFINE</text>
<rect x="56" y="947" width="1088" height="88" rx="12" fill="#172d26"/>
<text x="84" y="982" font-size="14" class="label" style="fill:#e8e7d7">READY FOR NEXT TIME</text>
<text x="84" y="1012" font-size="23" class="" style="fill:#f8f5ed">Decisions, accepted takes, open feedback and saved status.</text>
<text x="60" y="1084" font-size="20" class="muted" >A skill guides the work. Editing happens in your editor; automation needs a tested connection.</text>
</svg>
