<rect x="40" y="552" width="792" height="184" rx="20" fill="#fff" stroke="#dae3f0"/><circle cx="83" cy="598" r="23" fill="#2361b8"/><text x="83" y="607" text-anchor="middle" font-size="26" fill="white">3</text><text x="125" y="603" font-size="30" font-weight="700">Build a cut. Make it better.</text><text x="68" y="654" font-size="23" fill="#53667e">Preview → timecoded feedback → revision</text><text x="68" y="691" font-size="23" fill="#53667e">Check the output. Keep earlier versions.</text><g transform="translate(626 635)"><rect width="151" height="68" rx="8" fill="#edf2fb"/><rect x="10" y="22" width="44" height="28" rx="4" fill="#a6c6f3"/><rect x="58" y="22" width="27" height="28" rx="4" fill="#6b9bd7"/><rect x="89" y="22" width="52" height="28" rx="4" fill="#b7d0bf"/><path d="M72 9V59" stroke="#285a98" stroke-width="2"/></g>
