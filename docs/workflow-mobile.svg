<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1570" viewBox="0 0 560 1570" role="img" aria-labelledby="title desc">
<title id="title">From travel footage to a film with a story</title><desc id="desc">Gather the trip, find the story, edit in your chosen editor, review and refine, then approve delivery and save context. Review returns to editing. The skill guides the process; direct editing requires a tested connection.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#52635c" stroke-width="1.5"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a75532" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172d26}.serif{font-family:Georgia,Times,serif}.muted{fill:#52635c}.label{font-size:15px;letter-spacing:2.2px}.line{fill:none;stroke:#52635c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="560" height="1570" rx="20" fill="#f8f5ed"/>
<text x="36" y="51" font-size="15" class="label" >THE WORKFLOW</text>
<text x="34" y="111" font-size="44" class="serif" >From moments</text>
<text x="34" y="163" font-size="44" class="serif" >to a film.</text>
<text x="36" y="205" font-size="20" class="muted" >Your story. Your tools. Your decisions.</text>
<path d="M36 260H516" stroke="#d8dbcf"/>
<text x="38" y="311" font-size="32" class="serif" >01</text>
<text x="103" y="309" font-size="29" class="serif" >Gather the trip</text>
<text x="103" y="348" font-size="23" class="muted" >Footage, context,</text>
<text x="103" y="375" font-size="23" class="muted" >your memories.</text>
<text x="103" y="418" font-size="22" class="" >Catalogue + useful questions</text>
<path d="M56 333V447" class="line" marker-end="url(#arrow)"/>
<path d="M36 468H516" stroke="#d8dbcf"/>
<text x="38" y="519" font-size="32" class="serif" >02</text>
<text x="103" y="517" font-size="29" class="serif" >Find the story</text>
<text x="103" y="556" font-size="23" class="muted" >Choose moments.</text>
<text x="103" y="583" font-size="23" class="muted" >Record your voice.</text>
<text x="103" y="626" font-size="22" class="" >Scene plan + accepted takes</text>
<path d="M56 541V655" class="line" marker-end="url(#arrow)"/>
<path d="M36 676H516" stroke="#d8dbcf"/>
<text x="38" y="727" font-size="32" class="serif" >03</text>
<text x="103" y="725" font-size="29" class="serif" >Make the edit</text>
<text x="103" y="764" font-size="23" class="muted" >Picture and sound</text>
<text x="103" y="791" font-size="23" class="muted" >in your chosen editor.</text>
<text x="103" y="834" font-size="22" class="" >A version you can review</text>
<path d="M56 749V863" class="line" marker-end="url(#arrow)"/>
<path d="M36 884H516" stroke="#d8dbcf"/>
<text x="38" y="935" font-size="32" class="serif" >04</text>
<text x="103" y="933" font-size="29" class="serif" >Watch. Listen. Refine.</text>
<text x="103" y="972" font-size="23" class="muted" >Versioned comments.</text>
<text x="103" y="999" font-size="23" class="muted" >Make a specific change.</text>
<text x="103" y="1042" font-size="22" class="" >Earlier cuts stay safe</text>
<path d="M56 957V1071" class="line" marker-end="url(#arrow)"/>
<path d="M36 1092H516" stroke="#d8dbcf"/>
<text x="38" y="1143" font-size="32" class="serif" >05</text>
<text x="103" y="1141" font-size="29" class="serif" >Keep the film.</text>
<text x="103" y="1177" font-size="29" class="serif" >Keep the context.</text>
<text x="103" y="1211" font-size="19" class="muted" >Approve. Deliver. Save your work.</text>
<text x="103" y="1243" font-size="18" class="" >A film + a clear next step</text>
<path d="M504 935H529V744H504" fill="none" stroke="#a75532" stroke-width="1.5" marker-end="url(#return)"/>
<rect x="28" y="1320" width="504" height="116" rx="12" fill="#172d26"/>
<text x="50" y="1355" font-size="14" class="label" style="fill:#e8e7d7">READY FOR NEXT TIME</text>
<text x="50" y="1389" font-size="21" class="" style="fill:#f8f5ed">Decisions · feedback · saved status</text>
<text x="36" y="1480" font-size="20" class="" >A skill guides the work.</text>
<text x="36" y="1510" font-size="20" class="muted" >Editing happens in your editor.</text>
<text x="36" y="1540" font-size="17" class="muted" >Automation needs a tested connection.</text>
</svg>
